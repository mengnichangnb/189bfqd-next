name: Cloud189 Checkin

on:
  schedule:
    - cron: "35 22 * * *" # UTC 22:35 = 北京时间次日 06:35
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: 签到(失败自动重试)
        run: |
          ok=0
          for i in 1 2 3; do
            echo "===== 第 $i/3 次尝试 ====="
            if npm start; then ok=1; break; fi
            if [ "$i" -lt 3 ]; then
              echo "尝试 $i 失败,120 秒后重试"
              sleep 120
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "3 次尝试均失败"
            exit 1
          fi
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
          SIGN_CONCURRENCY: 3
